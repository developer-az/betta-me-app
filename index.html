      .surface-card { color: #0b1220; }

      html.dark .app-shell :is(.text-ink-400, .text-ink-500, .text-ink-600, .text-ink-700, .text-ink-800) {
        color: #e8dccb;
      }
      html.dark .app-shell :is(.text-brand-600, .text-brand-700, .text-brand-800):not([class*="bg-"]) {
        color: #5eead4;
      }

      html.dark .app-shell :is(.bg-white, .bg-white\/70, .bg-white\/90, .bg-cream-100, .bg-brand-50, .bg-amber-50, .bg-coral-50, .bg-ink-100):not([class*="dark:bg-"]) {
        color: #0b1220;
      }
      html.dark .app-shell :is(.bg-white, .bg-white\/70, .bg-white\/90, .bg-cream-100, .bg-brand-50, .bg-amber-50, .bg-coral-50, .bg-ink-100):not([class*="dark:bg-"]) :is(.text-ink-400) { color: #6b778c; }
